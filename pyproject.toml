[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-local"
version = "0.1.0"
description = "Local-first repository intelligence — deterministic analysis before AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "pathspec>=1,<2", "psycopg[binary]>=3.2,<4",
  "tree-sitter>=0.25,<0.27", "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

