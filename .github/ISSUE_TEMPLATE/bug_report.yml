name: Bug report
description: Report reproducible incorrect behavior in SENTINEL
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, private source, local usernames, and sensitive paths from every field and log excerpt.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start SENTINEL with ...
        2. Register a repository containing ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or startup
        - Repository indexing
        - Deterministic findings
        - Repository graph
        - Semantic search
        - Local AI reasoning
        - Reviewed changes
        - Web interface
        - API or persistence
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SENTINEL version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Node.js, database, browser, and optional Ollama or Docker versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Do not include secrets, private repository content, or personal paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, private source, and personal information.
          required: true
        - label: I can reproduce the problem on the stated version.
          required: true
